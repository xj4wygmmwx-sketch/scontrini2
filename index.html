<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Scontrini">
<link id="appIcon" rel="apple-touch-icon">
<title>Scontrini</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --o:#F47C20;--od:#C45E0A;--ol:#FEF0E4;--om:#FAB97A;
  --green:#34C759;--greend:#1E8A3A;
  --bg:#F7F2EE;--card:#fff;--text:#1A1A1A;--text2:#999;
  --border:#EDE8E3;--r:20px;--rs:12px;
  --shadow:0 2px 16px rgba(0,0,0,0.07);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);min-height:100vh;overflow-x:hidden;}

.page{position:fixed;inset:0;background:var(--bg);overflow-y:auto;transition:transform 0.35s cubic-bezier(.4,0,.2,1),opacity 0.35s;will-change:transform;}
.page.hidden{transform:translateX(100%);opacity:0;pointer-events:none;}
.page.slide-up{transform:translateY(100%);opacity:0;pointer-events:none;}

/* HERO */
#pageHome .hero{background:linear-gradient(135deg,#F47C20 0%,#E8500A 60%,#C8380A 100%);padding:3.5rem 1.5rem 2rem;position:relative;overflow:hidden;border-radius:0 0 36px 36px;}
.hero-blob1{position:absolute;top:-60px;right:-60px;width:220px;height:220px;background:rgba(255,255,255,0.1);border-radius:50%;}
.hero-blob2{position:absolute;bottom:-80px;left:-30px;width:180px;height:180px;background:rgba(255,255,255,0.06);border-radius:50%;}
.hero-blob3{position:absolute;top:40px;left:50%;width:100px;height:100px;background:rgba(255,200,100,0.12);border-radius:50%;}
.hero-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;position:relative;}
.hero-title{font-size:30px;font-weight:800;color:#fff;letter-spacing:-0.5px;}
.hero-subtitle{font-size:13px;color:rgba(255,255,255,0.75);margin-top:3px;}
.hero-avatar{width:46px;height:46px;background:rgba(255,255,255,0.2);border-radius:16px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);font-size:22px;}
.month-pill{display:flex;align-items:center;background:rgba(255,255,255,0.18);border-radius:16px;padding:11px 16px;gap:10px;position:relative;backdrop-filter:blur(8px);}
.month-pill select{background:none;border:none;color:#fff;font-size:15px;font-weight:600;appearance:none;-webkit-appearance:none;padding-right:22px;cursor:pointer;width:100%;}
.month-pill select option{color:#111;background:#fff;}
.month-pill-arrow{position:absolute;right:14px;top:50%;transform:translateY(-50%);pointer-events:none;opacity:0.8;}

/* STATS */
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:1.25rem 1.25rem 0;}
.stat-card{border-radius:var(--r);padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden;background:linear-gradient(135deg,#FFF5ED,#FFE8D0);border:1px solid #FAD0A8;}
.stat-card::after{content:'';position:absolute;bottom:-20px;right:-20px;width:80px;height:80px;border-radius:50%;background:#FAB97A;opacity:0.4;}
.stat-label{font-size:12px;font-weight:600;margin-bottom:6px;color:var(--od);opacity:0.8;}
.stat-val{font-size:32px;font-weight:800;line-height:1;position:relative;color:var(--o);}

/* ACTION BUTTONS */
.actions-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:1.25rem 1.25rem 0;}
.action-btn{padding:18px 14px;border:none;border-radius:var(--r);font-size:15px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;transition:transform 0.15s,box-shadow 0.15s;box-shadow:var(--shadow);}
.action-btn:active{transform:scale(0.96);}
.action-btn .btn-icon{width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;}
.action-btn.acquire{background:linear-gradient(135deg,var(--o),var(--od));color:#fff;box-shadow:0 6px 20px rgba(244,124,32,0.4);}
.action-btn.acquire .btn-icon{background:rgba(255,255,255,0.2);}
.action-btn.import{background:var(--card);color:var(--text);border:1px solid var(--border);box-shadow:var(--shadow);}
.action-btn.import .btn-icon{background:var(--ol);}

/* SECTION */
.section-header{display:flex;align-items:center;justify-content:space-between;padding:1.5rem 1.25rem 0.75rem;}
.section-title{font-size:17px;font-weight:800;color:var(--text);}
.export-btn-sm{display:flex;align-items:center;gap:6px;padding:8px 14px;background:linear-gradient(135deg,var(--green),var(--greend));border:none;border-radius:30px;font-size:13px;font-weight:700;color:#fff;cursor:pointer;box-shadow:0 4px 12px rgba(52,199,89,0.35);transition:transform 0.15s;}
.export-btn-sm:active{transform:scale(0.96);}
.export-btn-sm:disabled{opacity:0.35;pointer-events:none;box-shadow:none;background:#ccc;}

/* LIST */
.list{padding:0 1.25rem 6rem;display:flex;flex-direction:column;gap:10px;}
.receipt-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);animation:fadeUp 0.3s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
.receipt-thumb{width:58px;height:58px;border-radius:12px;object-fit:cover;border:1px solid var(--border);flex-shrink:0;cursor:pointer;transition:transform 0.15s;}
.receipt-thumb:active{transform:scale(0.95);}
.receipt-info{flex:1;min-width:0;}
.receipt-name{font-size:15px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.receipt-date{font-size:12px;color:var(--text2);margin-top:3px;}
.receipt-del{background:none;border:none;cursor:pointer;color:#ddd;padding:6px;}
.receipt-del:active{color:#e55;}
.empty-state{text-align:center;padding:3rem 1.5rem;}
.empty-circle{width:80px;height:80px;background:var(--ol);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-size:32px;}
.empty-title{font-size:17px;font-weight:700;color:var(--text);margin-bottom:6px;}
.empty-sub{font-size:14px;color:var(--text2);line-height:1.6;}

/* CONFIRM DIALOG */
.confirm-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:500;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);}
.confirm-overlay.active{display:flex;}
.confirm-box{background:var(--card);border-radius:24px 24px 0 0;padding:1.5rem 1.25rem 2.5rem;width:100%;max-width:480px;}
.confirm-title{font-size:17px;font-weight:700;color:var(--text);margin-bottom:6px;text-align:center;}
.confirm-sub{font-size:14px;color:var(--text2);text-align:center;margin-bottom:1.5rem;}
.confirm-actions{display:flex;flex-direction:column;gap:10px;}
.btn-confirm-del{padding:15px;border-radius:var(--r);border:none;background:#FF3B30;color:#fff;font-size:16px;font-weight:700;cursor:pointer;}
.btn-confirm-cancel{padding:15px;border-radius:var(--r);border:1px solid var(--border);background:var(--card);color:var(--text);font-size:16px;font-weight:600;cursor:pointer;}

/* CROP */
#pageCrop{background:#0A0A0A;}
.dark-topbar{display:flex;align-items:center;justify-content:space-between;padding:3.5rem 1.25rem 1rem;}
.dark-topbar span{color:#fff;font-size:17px;font-weight:700;}
.dark-topbar button{color:rgba(255,255,255,0.55);background:none;border:none;font-size:14px;cursor:pointer;}
.crop-canvas-area{flex:1;display:flex;align-items:center;justify-content:center;padding:0.5rem 1rem;position:relative;overflow:hidden;}
#cropImg{max-width:100%;display:block;user-select:none;-webkit-user-select:none;}
.crop-box{position:absolute;border:2px solid var(--o);}
.crop-handle{position:absolute;width:24px;height:24px;background:var(--o);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(0,0,0,0.4);}
.crop-handle.tr{top:0;right:0;transform:translate(50%,-50%);}
.crop-handle.bl{bottom:0;left:0;transform:translate(-50%,50%);}
.crop-handle.br{bottom:0;right:0;transform:translate(50%,50%);}
.dark-bottom{padding:1rem 1.25rem 2.5rem;display:flex;gap:10px;}
.btn-secondary{flex:1;padding:15px;border-radius:var(--r);border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);color:#fff;font-size:15px;cursor:pointer;}
.btn-primary{flex:2;padding:15px;border-radius:var(--r);border:none;background:linear-gradient(135deg,var(--o),var(--od));color:#fff;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(244,124,32,0.4);}

/* PREVIEW */
#pagePreview{background:#0A0A0A;}
#previewCanvas{max-width:100%;max-height:52vh;border-radius:12px;display:block;}
.filters-wrap{padding:1rem 1.25rem 0;display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;}
.filter-pill{flex-shrink:0;padding:8px 18px;border-radius:30px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.6);font-size:13px;cursor:pointer;transition:all 0.2s;}
.filter-pill.active{background:linear-gradient(135deg,var(--o),var(--od));border-color:var(--o);color:#fff;}
.name-input{margin:1rem 1.25rem 0;width:calc(100% - 2.5rem);padding:14px 16px;border-radius:var(--rs);border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.07);color:#fff;font-size:15px;}
.name-input::placeholder{color:rgba(255,255,255,0.3);}
.preview-img-area{flex:1;display:flex;align-items:center;justify-content:center;padding:0 1rem;}

/* EXPORT */
#pageExport{background:var(--bg);}
.export-topbar{display:flex;align-items:center;gap:12px;padding:3.5rem 1.25rem 1.25rem;}
.back-btn{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow);}
.export-topbar h2{font-size:20px;font-weight:800;color:var(--text);}
.export-summary{margin:0 1.25rem 1.25rem;background:linear-gradient(135deg,var(--green),var(--greend));border-radius:var(--r);padding:20px;color:#fff;display:flex;align-items:center;gap:16px;box-shadow:0 6px 20px rgba(52,199,89,0.3);}
.export-summary-icon{width:50px;height:50px;background:rgba(255,255,255,0.2);border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.export-summary-title{font-size:17px;font-weight:700;}
.export-summary-sub{font-size:13px;opacity:0.85;margin-top:2px;}
.export-list-title{padding:0 1.25rem 0.75rem;font-size:15px;font-weight:700;color:var(--text);}
.export-preview-list{padding:0 1.25rem;display:flex;flex-direction:column;gap:8px;margin-bottom:1.5rem;}
.export-item{background:var(--card);border:1px solid var(--border);border-radius:var(--rs);padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);}
.export-item img{width:44px;height:44px;border-radius:8px;object-fit:cover;}
.export-item-info{flex:1;}
.export-item-name{font-size:14px;font-weight:600;color:var(--text);}
.export-item-date{font-size:12px;color:var(--text2);margin-top:2px;}
.export-item-num{width:28px;height:28px;background:linear-gradient(135deg,var(--green),var(--greend));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0;}
.export-action{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 40%);padding:1.5rem 1.25rem 2.5rem;}
.btn-export-big{width:100%;padding:18px;background:linear-gradient(135deg,var(--green),var(--greend));border:none;border-radius:var(--r);font-size:17px;font-weight:700;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 20px rgba(52,199,89,0.4);transition:transform 0.15s;}
.btn-export-big:active{transform:scale(0.97);}
.btn-export-big:disabled{opacity:0.5;}

/* FULLSCREEN */
#pageFullscreen{background:#000;display:flex;align-items:center;justify-content:center;}
#fullscreenImg{max-width:100%;max-height:100vh;object-fit:contain;}
.fs-close{position:absolute;top:3rem;right:1.25rem;background:rgba(255,255,255,0.15);border:none;color:#fff;width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;}

input[type=file]{display:none;}
.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 22px;border-radius:30px;font-size:13px;font-weight:500;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;z-index:9999;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<!-- HOME -->
<div class="page" id="pageHome">
  <div class="hero">
    <div class="hero-blob1"></div><div class="hero-blob2"></div><div class="hero-blob3"></div>
    <div class="hero-top">
      <div>
        <div class="hero-title">Scontrini</div>
        <div class="hero-subtitle">Archivia e gestisci le tue spese</div>
      </div>
      <div class="hero-avatar">🧾</div>
    </div>
    <div class="month-pill">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <select id="monthSel"></select>
      <svg class="month-pill-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-card"><div class="stat-label">Scontrini</div><div class="stat-val" id="countVal">0</div></div>
    <div class="stat-card"><div class="stat-label">Mese</div><div class="stat-val" id="monthLabel">—</div></div>
  </div>

  <div class="actions-row">
    <button class="action-btn acquire" onclick="document.getElementById('fileCam').click()">
      <div class="btn-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
      </div>
      Acquisisci
    </button>
    <button class="action-btn import" onclick="document.getElementById('fileImport').click()">
      <div class="btn-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F47C20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
      </div>
      <span style="color:var(--text)">Importa</span>
    </button>
  </div>

  <div class="section-header">
    <span class="section-title">Questo mese</span>
    <button class="export-btn-sm" id="exportBtnSm" onclick="openExport()" disabled>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Esporta PDF
    </button>
  </div>
  <div class="list" id="receiptsList"></div>
</div>

<!-- CROP -->
<div class="page slide-up" id="pageCrop" style="display:flex;flex-direction:column;">
  <div class="dark-topbar"><span>Ritaglia</span><button onclick="skipCrop()">Salta ›</button></div>
  <div class="crop-canvas-area" id="cropArea">
    <img id="cropImg" src="" alt="" draggable="false">
    <div class="crop-box" id="cropBox">
      <div class="crop-handle tl" data-h="tl"></div>
      <div class="crop-handle tr" data-h="tr"></div>
      <div class="crop-handle bl" data-h="bl"></div>
      <div class="crop-handle br" data-h="br"></div>
    </div>
  </div>
  <div class="dark-bottom">
    <button class="btn-secondary" onclick="skipCrop()">Usa originale</button>
    <button class="btn-primary" onclick="doCrop()">Ritaglia</button>
  </div>
</div>

<!-- PREVIEW -->
<div class="page slide-up" id="pagePreview" style="display:flex;flex-direction:column;">
  <div class="dark-topbar"><span>Anteprima</span><button onclick="goBackToCrop()">‹ Ritaglia</button></div>
  <div class="preview-img-area"><canvas id="previewCanvas"></canvas></div>
  <div class="filters-wrap">
    <button class="filter-pill active" onclick="applyFilter('auto')" id="f-auto">✦ Auto</button>
    <button class="filter-pill" onclick="applyFilter('bw')" id="f-bw">B&N</button>
    <button class="filter-pill" onclick="applyFilter('contrast')" id="f-contrast">Contrasto</button>
    <button class="filter-pill" onclick="applyFilter('original')" id="f-original">Originale</button>
  </div>
  <input class="name-input" id="previewName" type="text" placeholder="Nome scontrino (es. Esselunga)">
  <div class="dark-bottom">
    <button class="btn-secondary" onclick="discardAll()">Scarta</button>
    <button class="btn-primary" onclick="saveReceipt()">Salva</button>
  </div>
</div>

<!-- EXPORT -->
<div class="page hidden" id="pageExport">
  <div class="export-topbar">
    <button class="back-btn" onclick="closePage('pageExport')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <h2>Esporta PDF</h2>
  </div>
  <div class="export-summary" id="exportSummary"></div>
  <div class="export-list-title">Scontrini inclusi</div>
  <div class="export-preview-list" id="exportPreviewList"></div>
  <div class="export-action">
    <button class="btn-export-big" id="exportBigBtn" onclick="doExportPDF()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Scarica PDF
    </button>
  </div>
</div>

<!-- FULLSCREEN -->
<div class="page hidden" id="pageFullscreen">
  <img id="fullscreenImg" src="" alt="">
  <button class="fs-close" onclick="closePage('pageFullscreen')">✕</button>
</div>

<!-- CONFIRM DELETE -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-title">Elimina scontrino</div>
    <div class="confirm-sub">Questa azione non può essere annullata.</div>
    <div class="confirm-actions">
      <button class="btn-confirm-del" id="confirmDelBtn">Elimina</button>
      <button class="btn-confirm-cancel" onclick="closeConfirm()">Annulla</button>
    </div>
  </div>
</div>

<input type="file" id="fileCam" accept="image/*" capture="environment">
<input type="file" id="fileImport" accept="image/*" multiple>
<div class="toast" id="toast"></div>

<script>
const MONTHS=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
let receipts=[],selMonth,selYear,rawImageData=null,croppedImageData=null,pendingDeleteId=null;

// Generate app icon via canvas
(function(){
  const c=document.createElement('canvas');c.width=180;c.height=180;
  const ctx=c.getContext('2d');
  // Background
  const g=ctx.createLinearGradient(0,0,180,180);
  g.addColorStop(0,'#F47C20');g.addColorStop(1,'#C8380A');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.roundRect(0,0,180,180,36);ctx.fill();
  // Receipt shape
  ctx.fillStyle='rgba(255,255,255,0.95)';
  ctx.beginPath();ctx.roundRect(44,24,92,120,8);ctx.fill();
  // Zigzag bottom
  ctx.fillStyle='rgba(255,255,255,0.95)';
  const zy=144,zw=8;
  for(let x=44;x<136;x+=zw*2){
    ctx.beginPath();ctx.moveTo(x,zy);ctx.lineTo(x+zw,zy+10);ctx.lineTo(x+zw*2,zy);ctx.closePath();ctx.fill();
  }
  // Lines on receipt
  ctx.fillStyle='rgba(200,90,10,0.25)';
  [[54,44,72,6],[54,58,84,6],[54,72,60,6],[54,86,78,6],[54,100,50,6]].forEach(([x,y,w,h])=>{
    ctx.beginPath();ctx.roundRect(x,y,w,h,3);ctx.fill();
  });
  // Camera icon overlay
  ctx.fillStyle='rgba(255,255,255,0.0)';
  document.getElementById('appIcon').href=c.toDataURL('image/png');
})();

function save(){try{localStorage.setItem('scontrini',JSON.stringify(receipts));}catch(e){}}
function load(){try{const d=localStorage.getItem('scontrini');if(d)receipts=JSON.parse(d);}catch(e){receipts=[];}}

function showPage(id){
  document.querySelectorAll('.page').forEach(p=>{
    if(p.id===id)p.classList.remove('hidden','slide-up');
    else if(p.id!=='pageHome'&&!p.classList.contains('hidden')&&!p.classList.contains('slide-up'))p.classList.add('hidden');
  });
}
function closePage(id){document.getElementById(id).classList.add('hidden');}

function initMonthSel(){
  const sel=document.getElementById('monthSel'),now=new Date();
  selMonth=now.getMonth();selYear=now.getFullYear();
  for(let i=0;i<12;i++){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const o=document.createElement('option');
    o.value=`${d.getFullYear()}-${d.getMonth()}`;
    o.textContent=`${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
    if(i===0)o.selected=true;
    sel.appendChild(o);
  }
  sel.addEventListener('change',()=>{const[y,m]=sel.value.split('-').map(Number);selYear=y;selMonth=m;render();});
}

// File inputs
document.getElementById('fileCam').addEventListener('change',function(){handleFile(this.files);this.value='';});
document.getElementById('fileImport').addEventListener('change',function(){handleFile(this.files);this.value='';});

function handleFile(files){
  if(!files||!files.length)return;
  const r=new FileReader();
  r.onload=e=>{rawImageData=e.target.result;openCrop(rawImageData);};
  r.readAsDataURL(files[0]);
}

// CROP
let cs={x:0,y:0,w:0,h:0,iw:0,ih:0,scale:1,offX:0,offY:0},dragMode=null,dragStart={};

function autoDetectCrop(imgEl,dw,dh){
  const sw=Math.min(imgEl.naturalWidth,600),sh=Math.round(imgEl.naturalHeight*(sw/imgEl.naturalWidth));
  const c=document.createElement('canvas');c.width=sw;c.height=sh;
  const ctx=c.getContext('2d');ctx.drawImage(imgEl,0,0,sw,sh);
  const data=ctx.getImageData(0,0,sw,sh).data;
  let total=0;for(let i=0;i<data.length;i+=4)total+=(data[i]+data[i+1]+data[i+2])/3;
  const thresh=Math.min(total/(sw*sh)*0.85,230);
  let minX=sw,maxX=0,minY=sh,maxY=0,found=false;
  for(let y=0;y<sh;y++)for(let x=0;x<sw;x++){
    const i=(y*sw+x)*4,bright=(data[i]+data[i+1]+data[i+2])/3;
    if(bright<thresh){found=true;if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;}
  }
  if(!found||maxX-minX<sw*0.1||maxY-minY<sh*0.1)return{x:0,y:0,w:dw,h:dh};
  const pad=12,ratio=dw/sw;
  return{x:Math.max(0,(minX-pad)*ratio),y:Math.max(0,(minY-pad)*ratio),w:Math.min(dw,(maxX-minX+pad*2)*ratio),h:Math.min(dh,(maxY-minY+pad*2)*ratio)};
}

function openCrop(dataUrl){
  const img=document.getElementById('cropImg');
  img.onload=()=>{
    const area=document.getElementById('cropArea'),ar=area.getBoundingClientRect();
    const iw=img.naturalWidth,ih=img.naturalHeight;
    const scale=Math.min((ar.width-32)/iw,(ar.height||500)/ih,1);
    const dw=iw*scale,dh=ih*scale;
    img.style.width=dw+'px';img.style.height=dh+'px';
    const offX=(ar.width-dw)/2,offY=(ar.height-dh)/2;
    const auto=autoDetectCrop(img,dw,dh);
    cs={x:auto.x,y:auto.y,w:auto.w,h:auto.h,iw:dw,ih:dh,scale,offX,offY};
    updateCropBox();
  };
  img.src=dataUrl;
  showPage('pageCrop');
  setupCropDrag();
}
function updateCropBox(){
  const b=document.getElementById('cropBox');
  b.style.cssText=`left:${cs.offX+cs.x}px;top:${cs.offY+cs.y}px;width:${cs.w}px;height:${cs.h}px;`;
}
function setupCropDrag(){
  const box=document.getElementById('cropBox'),area=document.getElementById('cropArea'),min=40;
  function pos(e){const t=e.touches?e.touches[0]:e,r=area.getBoundingClientRect();return{x:t.clientX-r.left-cs.offX,y:t.clientY-r.top-cs.offY};}
  function start(e){e.preventDefault();const p=pos(e),h=e.target.dataset.h;if(h)dragMode='h-'+h;else if(box.contains(e.target))dragMode='move';else return;dragStart={p,...cs};}
  function move(e){if(!dragMode)return;e.preventDefault();const p=pos(e),dx=p.x-dragStart.p.x,dy=p.y-dragStart.p.y;let{x,y,w,h}=dragStart;
    if(dragMode==='move'){x=Math.max(0,Math.min(cs.iw-w,x+dx));y=Math.max(0,Math.min(cs.ih-h,y+dy));}
    else{const hd=dragMode.split('-')[1];
      if(hd==='tl'){x=Math.min(x+w-min,x+dx);y=Math.min(y+h-min,y+dy);w=dragStart.x+dragStart.w-x;h=dragStart.y+dragStart.h-y;}
      else if(hd==='tr'){w=Math.max(min,w+dx);y=Math.min(y+h-min,y+dy);h=dragStart.y+dragStart.h-y;}
      else if(hd==='bl'){x=Math.min(x+w-min,x+dx);w=dragStart.x+dragStart.w-x;h=Math.max(min,h+dy);}
      else if(hd==='br'){w=Math.max(min,w+dx);h=Math.max(min,h+dy);}
      x=Math.max(0,x);y=Math.max(0,y);w=Math.min(cs.iw-x,w);h=Math.min(cs.ih-y,h);
    }
    cs={...cs,x,y,w,h};updateCropBox();}
  function end(){dragMode=null;}
  box.addEventListener('mousedown',start);box.addEventListener('touchstart',start,{passive:false});
  document.addEventListener('mousemove',move);document.addEventListener('touchmove',move,{passive:false});
  document.addEventListener('mouseup',end);document.addEventListener('touchend',end);
}
function doCrop(){
  const img=document.getElementById('cropImg');
  const full=document.createElement('canvas');
  full.width=img.naturalWidth;full.height=img.naturalHeight;
  full.getContext('2d').drawImage(img,0,0);
  const sx=cs.x/cs.scale,sy=cs.y/cs.scale,sw=cs.w/cs.scale,sh=cs.h/cs.scale;
  const c=document.createElement('canvas');c.width=sw;c.height=sh;
  c.getContext('2d').drawImage(full,sx,sy,sw,sh,0,0,sw,sh);
  croppedImageData=c.toDataURL('image/jpeg',0.97);
  showPage('pagePreview');openPreview(croppedImageData);
}
function skipCrop(){croppedImageData=rawImageData;showPage('pagePreview');openPreview(croppedImageData);}
function goBackToCrop(){showPage('pageCrop');}

// PREVIEW
function sharpen(ctx,w,h){
  const src=ctx.getImageData(0,0,w,h),dst=ctx.createImageData(w,h);
  const s=src.data,d=dst.data,k=[-1,-1,-1,-1,9,-1,-1,-1,-1];
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){
    const i=(y*w+x)*4;
    for(let c=0;c<3;c++){let v=0;for(let ky=-1;ky<=1;ky++)for(let kx=-1;kx<=1;kx++)v+=s[((y+ky)*w+(x+kx))*4+c]*k[(ky+1)*3+(kx+1)];d[i+c]=Math.min(255,Math.max(0,v));}
    d[i+3]=255;
  }
  ctx.putImageData(dst,0,0);
}
function openPreview(dataUrl){
  document.querySelectorAll('.filter-pill').forEach(b=>b.classList.remove('active'));
  document.getElementById('f-auto').classList.add('active');
  document.getElementById('previewName').value='';
  const img=new Image();img.onload=()=>renderFilter(img,'auto');img.src=dataUrl;
}
function renderFilter(imgOrNull,filter){
  const canvas=document.getElementById('previewCanvas');
  const doRender=image=>{
    const mw=window.innerWidth-32,mh=window.innerHeight*0.52;
    const sc=Math.min(mw/image.naturalWidth,mh/image.naturalHeight,1);
    canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;
    canvas.style.width=Math.round(image.naturalWidth*sc)+'px';
    canvas.style.height=Math.round(image.naturalHeight*sc)+'px';
    const ctx=canvas.getContext('2d');ctx.drawImage(image,0,0);
    if(filter==='original')return;
    const id=ctx.getImageData(0,0,canvas.width,canvas.height),d=id.data;
    for(let i=0;i<d.length;i+=4){
      const r=d[i],g=d[i+1],b=d[i+2];
      if(filter==='auto'){const gr=0.299*r+0.587*g+0.114*b;const v=Math.min(255,Math.max(0,(gr-80)*1.6+80));d[i]=d[i+1]=d[i+2]=v;}
      else if(filter==='bw'){const gr=0.299*r+0.587*g+0.114*b;d[i]=d[i+1]=d[i+2]=gr;}
      else if(filter==='contrast'){const f=1.8;d[i]=Math.min(255,Math.max(0,f*(r-128)+128));d[i+1]=Math.min(255,Math.max(0,f*(g-128)+128));d[i+2]=Math.min(255,Math.max(0,f*(b-128)+128));}
    }
    ctx.putImageData(id,0,0);
    sharpen(ctx,canvas.width,canvas.height);
  };
  if(imgOrNull)doRender(imgOrNull);
  else{const i2=new Image();i2.onload=()=>doRender(i2);i2.src=croppedImageData||rawImageData;}
}
function applyFilter(f){
  document.querySelectorAll('.filter-pill').forEach(b=>b.classList.remove('active'));
  document.getElementById('f-'+f).classList.add('active');
  renderFilter(null,f);
}
function discardAll(){
  ['pageCrop','pagePreview'].forEach(id=>document.getElementById(id).classList.add('slide-up'));
  rawImageData=null;croppedImageData=null;
}
function saveReceipt(){
  const canvas=document.getElementById('previewCanvas');
  const name=document.getElementById('previewName').value.trim()||'Scontrino';
  receipts.push({id:Date.now()+Math.random(),data:canvas.toDataURL('image/jpeg',0.98),name,ts:Date.now(),month:new Date().getMonth(),year:new Date().getFullYear(),imgW:canvas.width,imgH:canvas.height});
  save();
  ['pageCrop','pagePreview'].forEach(id=>document.getElementById(id).classList.add('slide-up'));
  rawImageData=null;croppedImageData=null;
  render();showToast('✓ Scontrino salvato');
}

// CONFIRM DELETE
function askDelete(id){
  pendingDeleteId=id;
  document.getElementById('confirmOverlay').classList.add('active');
}
function closeConfirm(){
  pendingDeleteId=null;
  document.getElementById('confirmOverlay').classList.remove('active');
}
document.getElementById('confirmDelBtn').onclick=function(){
  if(pendingDeleteId!=null){
    receipts=receipts.filter(r=>r.id!==pendingDeleteId);
    save();render();showToast('Scontrino eliminato');
  }
  closeConfirm();
};

// RENDER
function filtered(){return receipts.filter(r=>r.month===selMonth&&r.year===selYear).sort((a,b)=>a.ts-b.ts);}
function render(){
  const list=filtered();
  document.getElementById('countVal').textContent=list.length;
  document.getElementById('monthLabel').textContent=MONTHS[selMonth].slice(0,3);
  document.getElementById('exportBtnSm').disabled=list.length===0;
  const c=document.getElementById('receiptsList');
  if(!list.length){
    c.innerHTML=`<div class="empty-state"><div class="empty-circle">🧾</div><div class="empty-title">Nessuno scontrino</div><div class="empty-sub">Usa "Acquisisci" per fotografare<br>o "Importa" dalla galleria.</div></div>`;
    return;
  }
  c.innerHTML='';
  list.forEach((r,i)=>{
    const d=new Date(r.ts).toLocaleDateString('it-IT',{day:'2-digit',month:'long',year:'numeric'});
    const card=document.createElement('div');card.className='receipt-card';card.style.animationDelay=(i*0.05)+'s';
    card.innerHTML=`
      <img class="receipt-thumb" src="${r.data}" alt="" onclick="openFullscreen(${r.id})">
      <div class="receipt-info"><div class="receipt-name">${r.name}</div><div class="receipt-date">${d}</div></div>
      <button class="receipt-del" onclick="askDelete(${r.id})">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      </button>`;
    c.appendChild(card);
  });
}

// EXPORT
function openExport(){
  const list=filtered();if(!list.length)return;
  const mn=`${MONTHS[selMonth]} ${selYear}`;
  document.getElementById('exportSummary').innerHTML=`
    <div class="export-summary-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
    <div><div class="export-summary-title">${mn}</div><div class="export-summary-sub">${list.length} scontrino/i da esportare</div></div>`;
  const pl=document.getElementById('exportPreviewList');pl.innerHTML='';
  list.forEach((r,i)=>{
    const d=new Date(r.ts).toLocaleDateString('it-IT',{day:'2-digit',month:'long',year:'numeric'});
    const item=document.createElement('div');item.className='export-item';
    item.innerHTML=`<div class="export-item-num">${i+1}</div><img src="${r.data}" alt=""><div class="export-item-info"><div class="export-item-name">${r.name}</div><div class="export-item-date">${d}</div></div>`;
    pl.appendChild(item);
  });
  showPage('pageExport');
}
async function doExportPDF(){
  const list=filtered();if(!list.length)return;
  const btn=document.getElementById('exportBigBtn');
  btn.disabled=true;btn.textContent='Generazione PDF…';
  try{
    const{jsPDF}=window.jspdf;
    const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    const W=210,margin=15,H=297;
    doc.setFont('helvetica','bold');doc.setFontSize(16);
    doc.text(`Scontrini — ${MONTHS[selMonth]} ${selYear}`,margin,margin+5);
    doc.setFontSize(10);doc.setFont('helvetica','normal');doc.setTextColor(120);
    doc.text(`Totale: ${list.length} scontrino/i`,margin,margin+12);doc.setTextColor(0);
    for(let i=0;i<list.length;i++){
      const r=list[i];
      const d=new Date(r.ts).toLocaleDateString('it-IT',{day:'2-digit',month:'long',year:'numeric'});
      if(i>0)doc.addPage();
      let y=margin+(i===0?22:0);
      doc.setFontSize(11);doc.setFont('helvetica','bold');doc.text(`${i+1}. ${r.name}`,margin,y);
      doc.setFontSize(9);doc.setFont('helvetica','normal');doc.setTextColor(100);doc.text(d,margin,y+6);doc.setTextColor(0);
      const iw=r.imgW||800,ih=r.imgH||1200;
      const availW=W-margin*2,availH=H-y-12-margin;
      const ratio=Math.min(availW/iw,availH/ih);
      const fw=iw*ratio,fh=ih*ratio,fx=margin+(availW-fw)/2;
      doc.addImage(r.data,'JPEG',fx,y+12,fw,fh,'','FAST');
    }
    doc.save(`scontrini_${MONTHS[selMonth].toLowerCase()}_${selYear}.pdf`);
    showToast('✓ PDF scaricato');closePage('pageExport');
  }catch(e){showToast('Errore durante l\'esportazione');}
  btn.disabled=false;
  btn.innerHTML=`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Scarica PDF`;
}

function openFullscreen(id){
  const r=receipts.find(r=>r.id===id);if(!r)return;
  document.getElementById('fullscreenImg').src=r.data;
  showPage('pageFullscreen');
}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

load();initMonthSel();render();
</script>
